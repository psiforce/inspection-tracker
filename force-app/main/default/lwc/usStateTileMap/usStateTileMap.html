<template>
  <figure
    class="chart"
    aria-label="Share of listed facilities compliant, by state. Select a state to see its facilities."
  >
    <div class="map__plot">
      <svg viewBox={viewBox} preserveAspectRatio="xMidYMid meet">
        <template for:each={tiles} for:item="tile">
          <a
            key={tile.key}
            href={tile.href}
            aria-label={tile.ariaLabel}
            data-code={tile.code}
            onmouseenter={handleEnter}
            onfocus={handleEnter}
            onmouseleave={handleLeave}
            onblur={handleLeave}
          >
            <rect
              class={tile.tileClass}
              x={tile.x}
              y={tile.y}
              width={tile.size}
              height={tile.size}
              rx="4"
              fill={tile.fill}
            ></rect>
            <text
              class="tile__label"
              x={tile.labelX}
              y={tile.labelY}
              style={tile.labelStyle}
              text-anchor="middle"
            >
              {tile.code}
            </text>
          </a>
        </template>
      </svg>
      <template lwc:if={tooltip}>
        <div class="chart__tooltip" style={tooltip.style} aria-hidden="true">
          <span class="chart__tooltip-title">{tooltip.title}</span>
          <template for:each={tooltip.rows} for:item="row">
            <span key={row.key} class="chart__tooltip-row">{row.text}</span>
          </template>
        </div>
      </template>
    </div>
    <ul
      class="chart__legend map__legend"
      aria-label="Share of facilities compliant"
    >
      <template for:each={legend} for:item="item">
        <li key={item.key}>
          <span class="chart__swatch map__swatch" style={item.style}></span
          >{item.label}
        </li>
      </template>
    </ul>
    <table class="sr-only">
      <caption>
        Facility compliance by state
      </caption>
      <thead>
        <tr>
          <th scope="col">State</th>
          <th scope="col">Facilities</th>
          <th scope="col">Compliant</th>
          <th scope="col">Overdue</th>
          <th scope="col">Failing</th>
        </tr>
      </thead>
      <tbody>
        <template for:each={tableRows} for:item="row">
          <tr key={row.key}>
            <th scope="row">{row.name}</th>
            <td>{row.facilities}</td>
            <td>{row.pct}</td>
            <td>{row.overdue}</td>
            <td>{row.failing}</td>
          </tr>
        </template>
      </tbody>
    </table>
  </figure>
</template>
